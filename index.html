<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>NEBULA — Space Survival</title>
<style>
:root{--bg:#070b18;--cyan:#5df7ff;--purple:#a78bfa;--pink:#ff63c3;--gold:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf4ff;touch-action:none;user-select:none}
body{background:radial-gradient(ellipse at 50% 20%,#172344 0%,#0a1023 38%,#050711 100%)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 14px 0;gap:10px}
.panel{background:linear-gradient(135deg,rgba(12,20,42,.78),rgba(18,14,40,.56));border:1px solid rgba(110,220,255,.18);box-shadow:0 8px 30px #0005,inset 0 0 20px #5df7ff08;backdrop-filter:blur(10px);border-radius:16px;padding:10px 13px}
.brand{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:900}
.score{font-size:24px;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums}
.small{font-size:10px;color:#9db2d8;letter-spacing:1px}
.stats{display:flex;gap:8px}
.stat{min-width:68px;text-align:center}
.stat .score{font-size:17px}
.iconbtn{pointer-events:auto;border:1px solid #8aa6ff33;color:#dbe9ff;background:#111a33cc;border-radius:12px;width:42px;height:42px;font-size:18px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.controls{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.controls .iconbtn{width:44px;height:44px}
.overlay{pointer-events:auto;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,#0a1024a8,#03050bc9);backdrop-filter:blur(7px)}
.card{width:min(440px,100%);border:1px solid #5df7ff38;border-radius:24px;padding:25px 22px;background:linear-gradient(145deg,#111b36f2,#090e20f5);box-shadow:0 0 60px #4d3fff20,inset 0 0 35px #5df7ff07;text-align:center}
.logo{font-size:clamp(36px,10vw,58px);font-weight:1000;letter-spacing:5px;line-height:1;background:linear-gradient(90deg,#5df7ff,#b8a4ff,#ff63c3);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #6b7dff33}
.subtitle{font-size:11px;letter-spacing:4px;color:#91a7d4;margin:10px 0 20px}
.description{color:#b6c5e5;font-size:14px;line-height:1.9}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:14px 12px;font-weight:900;font-size:15px;color:#07101c;background:linear-gradient(90deg,#5df7ff,#a78bfa);box-shadow:0 8px 25px #5df7ff22;pointer-events:auto}
.btn.secondary{color:#dce7ff;background:#18233f;border:1px solid #5df7ff25;box-shadow:none}
.hint{font-size:11px;color:#8095bc;margin-top:14px;line-height:1.8}
.hidden{display:none!important}
.toast{position:fixed;left:50%;top:24%;transform:translateX(-50%);padding:10px 16px;border:1px solid #5df7ff44;background:#101b36dd;border-radius:999px;color:#c8fbff;font-weight:800;font-size:12px;opacity:0;transition:opacity .18s;pointer-events:none}
.toast.show{opacity:1}
@media(min-width:700px){.top{padding:22px}.panel{padding:13px 18px}.score{font-size:30px}.stat .score{font-size:20px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
  <div class="top">
    <div class="panel"><div class="brand">NEBULA / SURVIVAL</div><div class="score" id="score">000000</div><div class="small">SCORE</div></div>
    <div class="stats">
      <div class="panel stat"><div class="score" id="best">000000</div><div class="small">BEST</div></div>
      <div class="panel stat"><div class="score" id="level">01</div><div class="small">SECTOR</div></div>
      <button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button>
    </div>
  </div>
  <div class="controls">
    <button class="iconbtn" id="homeBtn" aria-label="Home">⌂</button>
    <button class="iconbtn" id="soundBtn" aria-label="Sound">♫</button>
    <button class="iconbtn" id="restartBtn" aria-label="Restart">↻</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="menu">
  <div class="card" id="homeCard">
    <div class="logo">NEBULA</div><div class="subtitle">SPACE SURVIVAL</div>
    <div class="description">به مرز ناشناخته کهکشان خوش آمدی، خلبان.</div>
    <div class="row"><button class="btn" id="playBtn">🚀 شروع بازی</button></div>
    <div class="row">
      <button class="btn secondary" id="shipsBtn">🛸 سفینه‌ها</button>
      <button class="btn secondary" id="recordsBtn">🏆 رکوردها</button>
    </div>
    <div class="row">
      <button class="btn secondary" id="missionsBtn">🌌 مأموریت‌ها</button>
      <button class="btn secondary" id="settingsBtn">⚙️ تنظیمات</button>
    </div>
    <div class="hint">حرکت: لمس و کشیدن انگشت · کامپیوتر: ← → یا A / D</div>
    <div class="small" style="margin-top:12px">BEST SCORE: <span id="homeBest">000000</span></div>
  </div>
  <div class="card hidden" id="subCard">
    <div class="logo" style="font-size:36px" id="subTitle">NEBULA</div>
    <div class="description" id="subContent"></div>
    <div class="row"><button class="btn secondary" id="backHomeBtn">← بازگشت</button></div>
  </div>
</div>
<div class="overlay hidden" id="pauseOverlay">
  <div class="card"><div class="logo" style="font-size:42px">PAUSED</div><div class="description">مأموریت متوقف شده.</div><div class="row"><button class="btn" id="resumeBtn">ادامه</button><button class="btn secondary" id="pauseRestart">از نو</button></div><div class="row"><button class="btn secondary" id="pauseHome">⌂ منوی اصلی</button></div></div>
</div>
<div class="overlay hidden" id="gameOver">
  <div class="card"><div class="logo" style="font-size:42px">MISSION<br>FAILED</div><div class="subtitle">YOUR RUN ENDED</div><div class="description">امتیاز این مأموریت</div><div class="score" id="finalScore" style="font-size:42px;margin:8px 0">000000</div><div class="description" id="newBest"></div><div class="row"><button class="btn" id="againBtn">دوباره تلاش 🚀</button></div></div>
</div>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,last=0,active=false,paused=false,over=false;
let score=0,best=0,sector=1,time=0,spawnTimer=0,crystalTimer=0,gamesPlayed=0,crystalsCollected=0;
let ship={x:0,y:0,targetX:0,targetY:0,r:13,shield:0,invuln:0};
let asteroids=[],crystals=[],particles=[],stars=[],keys={},pointerDown=false,sound=true,audioCtx=null;
try{best=Number(localStorage.getItem('nebula_best')||0)||0;gamesPlayed=Number(localStorage.getItem('nebula_games')||0)||0;crystalsCollected=Number(localStorage.getItem('nebula_crystals')||0)||0}catch(e){}
$('best').textContent=fmt(best);$('homeBest').textContent=fmt(best);
function fmt(n){return String(Math.floor(n)).padStart(6,'0')}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);ship.y=H*.78;if(!active)ship.x=W*.5;ship.targetX=ship.x;ship.targetY=ship.y;stars=Array.from({length:Math.max(50,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+0.3}))}
window.addEventListener('resize',resize,{passive:true});resize();
function soundFx(freq=440,dur=.06,type='sine'){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),850)}
function reset(){gamesPlayed++;try{localStorage.setItem('nebula_games',String(gamesPlayed))}catch(e){}score=0;sector=1;time=0;spawnTimer=.4;crystalTimer=2;asteroids=[];crystals=[];particles=[];ship.x=W/2;ship.y=H*.78;ship.targetX=ship.x;ship.targetY=ship.y;ship.shield=0;ship.invuln=1.4;active=true;paused=false;over=false;$('score').textContent=fmt(0);$('level').textContent='01';$('menu').classList.add('hidden');$('gameOver').classList.add('hidden');$('pauseOverlay').classList.add('hidden');soundFx(660,.1)}
function pause(){if(!active||over)return;paused=!paused;$('pauseOverlay').classList.toggle('hidden',!paused);soundFx(paused?260:520,.08)}
function endGame(){active=false;over=true;$('finalScore').textContent=fmt(score);let isNew=score>best;if(isNew){best=score;try{localStorage.setItem('nebula_best',String(best))}catch(e){}$('best').textContent=fmt(best);$('homeBest').textContent=fmt(best);$('homeBest').textContent=fmt(best);$('newBest').textContent='🏆 رکورد جدید!';}else $('newBest').textContent='رکورد قبلی: '+fmt(best);$('gameOver').classList.remove('hidden');soundFx(120,.3,'sawtooth')}
function setTarget(x,y){ship.targetX=Math.max(ship.r+8,Math.min(W-ship.r-8,x));ship.targetY=Math.max(H*.48,Math.min(H-ship.r-15,y))}
canvas.addEventListener('pointerdown',e=>{pointerDown=true;canvas.setPointerCapture?.(e.pointerId);setTarget(e.clientX,e.clientY)});
canvas.addEventListener('pointermove',e=>{if(pointerDown)setTarget(e.clientX,e.clientY)});
canvas.addEventListener('pointerup',()=>pointerDown=false);canvas.addEventListener('pointercancel',()=>pointerDown=false);
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key==='Escape'||e.key.toLowerCase()==='p')pause();if(e.key==='Enter'&&(over||!active))reset()});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('homeBest').textContent=fmt(best);
function showHome(){active=false;paused=false;over=false;$('pauseOverlay').classList.add('hidden');$('gameOver').classList.add('hidden');$('menu').classList.remove('hidden');$('homeCard').classList.remove('hidden');$('subCard').classList.add('hidden');}
function showSub(title,content){$('homeCard').classList.add('hidden');$('subCard').classList.remove('hidden');$('subTitle').textContent=title;$('subContent').innerHTML=content;}
$('playBtn').onclick=reset;
$('shipsBtn').onclick=()=>showSub('🛸 سفینه‌ها',`<div style="font-size:18px;color:#5df7ff;font-weight:900">NEBULA-01</div><p>سفینه پیش‌فرض · متعادل</p><div style="font-size:42px">🚀</div><p>سفینه‌های جدید در نسخه‌های بعدی قابل آزادسازی خواهند بود.</p>`);
$('recordsBtn').onclick=()=>showSub('🏆 رکوردها',`<p>بالاترین امتیاز: <b style="color:#5df7ff">${fmt(best)}</b></p><p>تعداد مأموریت‌ها: <b>${gamesPlayed}</b></p><p>کریستال‌های جمع‌شده: <b>${crystalsCollected}</b></p>`);
$('missionsBtn').onclick=()=>showSub('🌌 مأموریت‌ها',`<p>🚀 در یک مأموریت ۳۰ ثانیه زنده بمان</p><p>💎 پنج کریستال جمع کن</p><p>☄️ از برخورد با شهاب‌سنگ‌ها جاخالی بده</p><p class="hint">سیستم پاداش مأموریت‌ها در آپدیت بعدی اضافه می‌شود.</p>`);
$('settingsBtn').onclick=()=>showSub('⚙️ تنظیمات',`<p>صدا: <b>${sound?'روشن':'خاموش'}</b></p><button class="btn secondary" onclick="document.getElementById('soundBtn').click();document.getElementById('settingsBtn').click()">تغییر وضعیت صدا</button><p class="hint">کنترل‌ها: لمس و کشیدن · کیبورد: WASD یا جهت‌ها</p>`);
$('backHomeBtn').onclick=()=>{$('subCard').classList.add('hidden');$('homeCard').classList.remove('hidden')};
$('homeBtn').onclick=showHome;$('pauseHome').onclick=showHome;$('gameOverHome').onclick=showHome;
$('againBtn').onclick=reset;$('restartBtn').onclick=()=>reset();$('pauseBtn').onclick=pause;$('resumeBtn').onclick=pause;$('pauseRestart').onclick=reset;
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'♫':'♪';toast(sound?'صدا روشن شد':'صدا خاموش شد');if(sound)soundFx(550,.08)};
function spawnAsteroid(){let r=12+Math.random()*23;asteroids.push({x:Math.random()*(W-2*r)+r,y:-r-5,r,vy:100+sector*13+Math.random()*65,vx:(Math.random()-.5)*45,rot:Math.random()*6.28,vr:(Math.random()-.5)*2,shape:Array.from({length:9},()=>.72+Math.random()*.45)})}
function spawnCrystal(){crystals.push({x:18+Math.random()*(W-36),y:-20,r:9,vy:105+sector*8,phase:Math.random()*6.28})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*160;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.6,max:.9,color,size:1+Math.random()*3})}}
function circleHit(a,b){let dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<(a.r+b.r)*(a.r+b.r)}
function update(dt){if(!active||paused)return;time+=dt;sector=1+Math.floor(time/18);$('level').textContent=String(sector).padStart(2,'0');spawnTimer-=dt;crystalTimer-=dt;
if(spawnTimer<=0){spawnAsteroid();spawnTimer=Math.max(.22,.82-sector*.045)*(0.65+Math.random()*.65)}
if(crystalTimer<=0){spawnCrystal();crystalTimer=4.4+Math.random()*3}
let speed=420;if(keys.arrowleft||keys.a)ship.targetX-=speed*dt;if(keys.arrowright||keys.d)ship.targetX+=speed*dt;if(keys.arrowup||keys.w)ship.targetY-=speed*dt;if(keys.arrowdown||keys.s)ship.targetY+=speed*dt;
ship.targetX=Math.max(ship.r+8,Math.min(W-ship.r-8,ship.targetX));ship.targetY=Math.max(H*.48,Math.min(H-ship.r-15,ship.targetY));
ship.x+=(ship.targetX-ship.x)*Math.min(1,dt*12);ship.y+=(ship.targetY-ship.y)*Math.min(1,dt*12);ship.invuln=Math.max(0,ship.invuln-dt);ship.shield=Math.max(0,ship.shield-dt);
stars.forEach(s=>{s.y+=70*s.z*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}});
asteroids.forEach(a=>{a.y+=a.vy*dt;a.x+=a.vx*dt;a.rot+=a.vr*dt});
crystals.forEach(c=>{c.y+=c.vy*dt;c.x+=Math.sin(time*2+c.phase)*24*dt});
for(let i=asteroids.length-1;i>=0;i--){let a=asteroids[i];if(a.y>H+50||a.x<-60||a.x>W+60)asteroids.splice(i,1);else if(ship.invuln<=0&&circleHit(ship,a)){if(ship.shield>0){ship.shield=0;ship.invuln=1;burst(a.x,a.y,'#5df7ff',20);asteroids.splice(i,1);soundFx(200,.18,'triangle');toast('سپر نجاتت داد!')}else{burst(ship.x,ship.y,'#ff63c3',28);endGame();return}}}
for(let i=crystals.length-1;i>=0;i--){let c=crystals[i];if(c.y>H+30)crystals.splice(i,1);else if(circleHit(ship,c)){score+=250;crystalsCollected++;try{localStorage.setItem('nebula_crystals',String(crystalsCollected))}catch(e){}crystals.splice(i,1);burst(c.x,c.y,'#5df7ff',14);soundFx(880,.08);toast('+250 کریستال')}}
score+=Math.floor(dt*(8+sector*2));$('score').textContent=fmt(score);
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.98;p.vy*=.98});particles=particles.filter(p=>p.life>0);
}
function drawShip(){ctx.save();ctx.translate(ship.x,ship.y);let flicker=6+Math.random()*7;ctx.fillStyle='#5df7ff';ctx.shadowBlur=18;ctx.shadowColor='#5df7ff';ctx.beginPath();ctx.moveTo(0,19);ctx.lineTo(-5,9);ctx.lineTo(0,9+flicker);ctx.lineTo(5,9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#d8faff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(12,12);ctx.lineTo(0,7);ctx.lineTo(-12,12);ctx.closePath();ctx.fill();ctx.fillStyle='#7a8dff';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(4,4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();ctx.strokeStyle='#5df7ff';ctx.lineWidth=1.5;ctx.stroke();if(ship.shield>0){ctx.strokeStyle='#5df7ff99';ctx.lineWidth=2;ctx.shadowBlur=18;ctx.shadowColor='#5df7ff';ctx.beginPath();ctx.arc(0,0,23+Math.sin(time*8)*2,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function drawAsteroid(a){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);ctx.beginPath();for(let i=0;i<a.shape.length;i++){let ang=i/a.shape.length*Math.PI*2,rr=a.r*a.shape[i],x=Math.cos(ang)*rr,y=Math.sin(ang)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();let g=ctx.createRadialGradient(-a.r*.3,-a.r*.3,2,0,0,a.r);g.addColorStop(0,'#586078');g.addColorStop(1,'#20283a');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#8993a833';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function drawCrystal(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(time*3+c.phase)*.4);ctx.shadowBlur=20;ctx.shadowColor='#5df7ff';ctx.fillStyle='#5df7ff';ctx.beginPath();ctx.moveTo(0,-c.r);ctx.lineTo(c.r*.7,0);ctx.lineTo(0,c.r);ctx.lineTo(-c.r*.7,0);ctx.closePath();ctx.fill();ctx.fillStyle='#eaffff';ctx.beginPath();ctx.moveTo(0,-c.r*.6);ctx.lineTo(c.r*.3,0);ctx.lineTo(0,c.r*.6);ctx.closePath();ctx.fill();ctx.restore()}
function draw(){ctx.fillStyle='#050813';ctx.fillRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.25,0,W*.5,H*.25,Math.max(W,H)*.75);bg.addColorStop(0,'#111b39');bg.addColorStop(1,'#050813');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.globalAlpha=.25+s.z*.25;ctx.fillStyle='#c8e9ff';ctx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5)});ctx.globalAlpha=1;asteroids.forEach(drawAsteroid);crystals.forEach(drawCrystal);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;if(active||over)drawShip();if(!active&&!over){ctx.fillStyle='#5df7ff08';ctx.fillRect(0,H*.5,W,H*.5)}}
function loop(ts){if(!last)last=ts;let dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
